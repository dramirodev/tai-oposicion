# Despliegue automático: cada push a main ejecuta los tests, compila y publica en Firebase Hosting.
name: Desplegar en Firebase

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Límites de arquitectura y hooks
        run: npm run lint

      - name: Evitar nuevas excepciones de lint
        run: npm run lint:ignore-growth

      - name: Comprobar tipos (si fallan, no se despliega)
        run: npm run typecheck

      - name: Tests (si fallan, no se despliega)
        run: npm test

      - name: Instalar navegadores e2e
        run: npx playwright install --with-deps chromium webkit

      - name: E2E y comparación con la fase 0
        run: npm run test:e2e:ci

      - name: Compilar dist
        run: npm run build

      - name: Validar tarjetas
        run: node scripts/validate_cards.mjs

      - name: Credenciales de Firebase
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TAI_OPOSICION }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Desplegar hosting
        run: npx --yes firebase-tools@13.35.1 deploy --only hosting --project tai-oposicion --non-interactive

      # Las reglas de Firestore necesitan el rol «Firebase Rules Admin» en la cuenta de servicio.
      # Si aún no se lo has dado, no rompe el hosting, pero deja un aviso visible en la ejecución.
      - name: Desplegar reglas de Firestore
        run: npx --yes firebase-tools@13.35.1 deploy --only firestore:rules --project tai-oposicion --non-interactive || echo "::warning title=Reglas de Firestore::NO se han desplegado; revisa el rol Firebase Rules Admin de la cuenta de servicio" 
