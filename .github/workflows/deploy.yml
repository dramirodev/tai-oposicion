# Despliegue automático: cada push a main ejecuta los tests, compila y publica en Firebase Hosting.
name: Desplegar en Firebase

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Validar candidatos y fuentes editoriales
        run: python3 -m unittest discover -s tools/question-editorial -p "test_*.py"
      - name: Aislamiento Auth y Firestore de sesiones
        run: npx --yes firebase-tools@13.35.1 emulators:exec --only auth,firestore --project demo-tai-auth "npx vitest run tests/astra-auth-firestore.test.js"
      - name: Publicación atómica y concurrente en emulador
        run: npx --yes firebase-tools@13.35.1 emulators:exec --only firestore --project demo-tai-bank-atomic "npx vitest run tests/publish-bank-emulator.test.js"

      - name: Evitar nueva deuda de arquitectura
        run: npm run check:architecture

      - name: Límites de arquitectura y hooks
        run: npm run lint

      - name: Evitar nuevas excepciones de lint
        run: npm run lint:ignore-growth

      - name: Comprobar tipos (si fallan, no se despliega)
        run: npm run typecheck

      - name: Tests (si fallan, no se despliega)
        run: npm test

      - name: Compilar dist
        run: npm run build

      - name: Validar tarjetas
        run: node scripts/validate_cards.mjs

      - name: Validar reglas de Firestore en el emulador
        run: npm run test:firestore-rules

      - name: Credenciales de Firebase
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TAI_OPOSICION }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Rules forman parte del límite de autorización: si este paso falla, la release se detiene antes de publicar Hosting.
      # La cuenta de servicio necesita el rol «Firebase Rules Admin».
      # The version tag is created only after a successful deploy. Comparing with
      # it also catches rules left pending by an earlier failed main deployment.
      - name: Seleccionar recursos desde la última publicación correcta
        id: deploy_scope
        run: |
          published_tag=$(git describe --tags --match 'v*+*' --abbrev=0 "$GITHUB_SHA" 2>/dev/null || true)
          if [[ "$published_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+[a-f0-9]{7}$ ]] && git diff --quiet "$published_tag" "$GITHUB_SHA" -- firestore.rules firebase.json .firebaserc; then
            echo "rules_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "rules_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Desplegar reglas de Firestore
        if: github.event_name != 'push' || steps.deploy_scope.outputs.rules_changed == 'true'
        run: npx --yes firebase-tools@13.35.1 deploy --only firestore:rules --project tai-oposicion --non-interactive

      - name: Desplegar hosting
        run: npx --yes firebase-tools@13.35.1 deploy --only hosting --project tai-oposicion --non-interactive

  tag:
    name: Etiquetar build validado
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Crear tag único de versión y commit
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}+${COMMIT_SHA:0:7}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "El tag $tag ya existe; no se vuelve a crear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$COMMIT_SHA" -m "TAI $tag"
          git push origin "refs/tags/$tag"
