<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Prepara la oposición de Técnico Auxiliar de Informática con preguntas, simulacros, repasos y seguimiento de tu progreso.">
<meta name="theme-color" content="#f5f6f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TAI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Preparación TAI</title>
</head>
<body class="is-initial-loading">
<div id="skip-nav"></div>
<div id="workspace-shell"></div>
<main id="app" tabindex="-1"></main>
<div id="initial-loading" class="initial-loading">
  <div id="initial-loading-progress" role="status" aria-live="polite" aria-label="Cargando">
    <p class="initial-loading__label">Cargando</p>
    <div class="initial-loading__track" role="progressbar" aria-label="Carga inicial" aria-valuetext="Cargando la aplicación"><span></span></div>
  </div>
  <section id="initial-update-dialog" class="initial-update" role="dialog" aria-modal="true" aria-labelledby="initial-update-title" hidden>
    <h1 id="initial-update-title">Actualización disponible</h1>
    <p>Hay una nueva versión de TAI. ¿Quieres actualizar antes de entrar?</p>
    <p id="initial-update-version" class="initial-update__version"></p>
    <p id="initial-update-status" class="initial-update__status" aria-live="polite"></p>
    <div class="initial-update__actions">
      <button id="initial-update-confirm" class="initial-update__primary" type="button">Actualizar ahora</button>
      <button id="initial-update-continue" type="button">Entrar sin actualizar</button>
    </div>
  </section>
</div>
<script type="module" src="/src/app/main.tsx"></script>
</body>
</html>
